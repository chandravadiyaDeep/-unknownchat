name: Deploy unknownchat to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          match = re.search(r'<script type="module">([\s\S]*?)</script>', html)
          if not match:
              raise SystemExit("Module script not found in index.html")
          script = match.group(1)
          Path("/tmp/unknownchat.mjs").write_text(script, encoding="utf-8")
          ids = re.findall(r'\bid="([^"]+)"', html)
          duplicates = sorted({item for item in ids if ids.count(item) > 1})
          referenced = set(re.findall(r"\$\('([^']+)'\)", script))
          missing = sorted(referenced - set(ids))
          if duplicates:
              raise SystemExit(f"Duplicate HTML ids: {duplicates}")
          if missing:
              raise SystemExit(f"JavaScript references missing HTML ids: {missing}")
          if "@trystero-p2p/torrent@0.27.0" not in script:
              raise SystemExit("Trystero dependency must remain pinned to 0.27.0")
          print(f"Validated {len(ids)} unique HTML ids and {len(referenced)} JavaScript selectors")
          PY
          node --check /tmp/unknownchat.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
