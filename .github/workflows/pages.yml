name: Deploy unknownchat to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate bot and activity JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          library = json.loads(Path("bots/bot-library.json").read_text(encoding="utf-8"))
          bots = library.get("bots", [])
          answerers = [bot for bot in bots if bot.get("kind") == "answerer"]
          questioners = [bot for bot in bots if bot.get("kind") == "questioner"]
          assert len(bots) == 40, f"Expected 40 bots, found {len(bots)}"
          assert len(answerers) == 20, f"Expected 20 answerers, found {len(answerers)}"
          assert len(questioners) == 20, f"Expected 20 questioners, found {len(questioners)}"
          assert all(len(bot.get("replies", [])) == 100 for bot in bots), "Every bot must have 100 messages"
          assert all(len({reply.get("text") for reply in bot["replies"]}) == 100 for bot in bots), "Duplicate reply inside a bot profile"
          pulse = json.loads(Path("bots/activity-pulse.json").read_text(encoding="utf-8"))
          assert len(pulse.get("values", [])) == 500, "Activity pulse must contain 500 samples"
          assert all(isinstance(value, int) and 0 < value < 100 for value in pulse["values"]), "Invalid activity pulse values"
          print("Validated 40 bots, 4,000 bot messages, and 500 activity samples.")
          PY
      - name: Validate inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          match = re.search(r'<script type="module">([\s\S]*?)</script>', html)
          if not match:
              raise SystemExit("Module script not found in index.html")
          script = match.group(1)
          Path("/tmp/unknownchat.mjs").write_text(script, encoding="utf-8")
          ids = re.findall(r'\bid="([^"]+)"', html)
          duplicates = sorted({item for item in ids if ids.count(item) > 1})
          referenced = set(re.findall(r"\$\('([^']+)'\)", script))
          missing = sorted(referenced - set(ids))
          if duplicates:
              raise SystemExit(f"Duplicate HTML ids: {duplicates}")
          if missing:
              raise SystemExit(f"JavaScript references missing HTML ids: {missing}")
          if "https://esm.run/trystero@0.27.0" not in script:
              raise SystemExit("Trystero default Nostr dependency must remain pinned to 0.27.0")
          print(f"Validated {len(ids)} unique HTML ids and {len(referenced)} JavaScript selectors")
          PY
          node --check /tmp/unknownchat.mjs
          node --check bots/bot-engine.js
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
